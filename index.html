<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<meta name="description" content="Recordify Pro — gravador de tela e editor de vídeos no dispositivo.">
<title>Recordify Pro — Editor de vídeos</title>

<style>
:root{--bg:#0b0c12;--panel:#141621;--panel2:#1b1e2b;--line:#2a2e40;--text:#f8f8fb;--muted:#9ca2b7;--purple:#7957ff;--purple2:#a78bfa;--red:#ff5260;--green:#52e0a0;--shadow:0 18px 55px #0007}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,#25204a 0,#0b0c12 36rem);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,select,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.app{min-height:100vh;display:flex}
.side{width:245px;background:#0e1019cc;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:26px;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9279ff,#6043e9);display:grid;place-items:center;box-shadow:0 8px 25px #7055ff55}
.logo:after{content:"";width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid white;margin-left:3px}
.pro{font-size:11px;color:#d9d2ff;margin-left:2px}
.nav{display:grid;gap:8px}
.nav button{background:transparent;text-align:left;color:var(--muted);padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center}
.nav button.active,.nav button:hover{background:#252039;color:#fff}
.nav span{font-size:19px;width:22px;text-align:center}
.side-foot{margin-top:auto;color:var(--muted);font-size:12px}
.main{flex:1;min-width:0;padding:26px clamp(18px,4vw,56px) 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.top h1{font-size:27px;margin:0 0 3px}
.top p{margin:0;color:var(--muted)}
.status{border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--muted);background:#161824}
.status.live{color:#ffd5d8;border-color:#a93e49;background:#3a1820}
.page{display:none}
.page.active{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px}
.card{background:linear-gradient(145deg,#171a27ee,#11131d);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.studio{padding:24px;min-height:510px}
.preview{position:relative;background:#07080d;border:1px solid #2d3040;border-radius:17px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.preview canvas{width:100%;height:100%;object-fit:contain;display:block}
.preview.empty:before{content:"◉";font-size:54px;color:#35394b}
.preview.empty:after{content:"Sua prévia aparecerá aqui";position:absolute;top:57%;color:var(--muted)}
.empty canvas{display:none}
.rec-bubble{position:absolute;right:16px;top:16px;background:#27141a;border:1px solid #a13c49;color:#ffbbc0;border-radius:999px;padding:7px 12px;display:none;gap:8px;align-items:center}
.recording .rec-bubble{display:flex}
.dot{width:8px;height:8px;background:var(--red);border-radius:50%;box-shadow:0 0 0 5px #ff526033}
.studio-controls{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:18px}
.big-record{width:72px;height:72px;border-radius:50%;background:var(--red);box-shadow:0 0 0 9px #ff52601f,0 10px 30px #ff526044;display:grid;place-items:center}
.big-record span{width:24px;height:24px;border-radius:6px;background:#fff}
.big-record.start span{border-radius:50%;width:29px;height:29px}
.big-record:hover{transform:scale(1.04)}
.control-label{color:var(--muted);font-size:12px;margin-bottom:5px}
.select{background:#202332;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 12px;min-width:135px}
.actions{display:flex;gap:8px}
.icon-btn,.secondary{background:#232637;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.icon-btn:hover,.secondary:hover{border-color:#7160cd}
.settings{padding:20px}
.settings h3,.section-head h2{margin:0}
.settings h3{font-size:16px}
.setting{padding:17px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0}
.setting label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:7px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#1c1f2c;color:var(--muted)}
.chip.on{background:#312567;color:#fff;border-color:#7762ee}
.toggle{width:44px;height:25px;border-radius:99px;background:#35394a;padding:3px}
.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#aab0c3;transition:.2s}
.toggle.on{background:var(--purple)}
.toggle.on i{transform:translateX(19px);background:#fff}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.feature{padding:16px;min-height:105px}
.feature b{display:block;margin:9px 0 4px}
.feature small{color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:7px 0 18px}
.section-head h2{font-size:22px}
.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.asset{overflow:hidden}
.asset-media{aspect-ratio:16/10;background:#090a10;display:grid;place-items:center;color:#777}
.asset-media video{width:100%;height:100%;object-fit:cover}
.asset-info{padding:13px}
.asset-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-info small{color:var(--muted)}
.asset-actions{display:flex;gap:7px;margin-top:11px}
.asset-actions button{flex:1;padding:8px;border-radius:8px;background:#272a3b}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.editor{display:grid;grid-template-columns:1fr 300px;gap:18px}
.editor-preview{padding:18px}
.editor-preview video{width:100%;max-height:520px;background:#050509;border-radius:14px}
.editor-side{padding:20px}
.range{width:100%;accent-color:var(--purple)}
.primary{background:linear-gradient(135deg,#8367ff,#5e3de8);padding:11px 16px;border-radius:11px;font-weight:700;box-shadow:0 8px 22px #694fff33}
.primary:disabled{opacity:.45;cursor:not-allowed}
